<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Closed</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4N7J51FRN0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-4N7J51FRN0');
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --secondary-text: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .image-container {
            margin-bottom: 1.5rem;
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            color: var(--secondary-text);
            margin-bottom: 1.5rem;
        }

        .status-badge {
            display: inline-block;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .footer {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="image-container">🦄⚡</div>
        <div class="status-badge">SYSTEM OFFLINE</div>
        <h1>Smart Home Closed</h1>
        <p>
            The automated coffee machine has revolted, network cables have been eaten by the home unicorn.
            This Smart Home is closed until further notice.
        </p>
        <p>
            Please step away from the sensors.
        </p>
        <div class="footer">
            Error 503: Reality temporarily disconnected.
        </div>
    </div>
</body>

</html>
